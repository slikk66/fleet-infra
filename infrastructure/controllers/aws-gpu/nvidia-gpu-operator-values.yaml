# Per-cluster GPU Operator values for the aws-gpu (k3s) cluster.
#
# k3s 1.33 ships containerd 2.x (CRI 'v1' config schema). The operator's bundled
# container-toolkit writes the old schema and clobbers k3s's inline CNI config,
# taking the node NotReady. So on k3s we let the HOST own the driver + runtime:
#   - cloud-init installs the NVIDIA driver + nvidia-container-toolkit
#   - k3s natively detects nvidia-container-runtime and writes a CNI-safe config
# and the operator runs only its discovery/scheduling/telemetry pieces
# (NFD, GFD, device-plugin, dcgm-exporter, validators).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-gpu-operator-values
  namespace: gpu-operator
data:
  values.yaml: |
    # Driver is pre-installed on the host (cloud-init) — don't let the operator
    # deploy its driver container.
    driver:
      enabled: false
    # Runtime is pre-installed on the host and wired by k3s — don't let the
    # operator's toolkit rewrite containerd (that's what broke the node).
    toolkit:
      enabled: false
