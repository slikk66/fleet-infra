apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Per-cluster overlay for the "aws-gpu" cluster's infrastructure controllers.
# Real A10G hardware → the real NVIDIA GPU Operator (not the fake sibling).
# No gpu-nodes.yaml here: NFD/GFD discover the real GPU and label the node,
# so we don't hand-author node labels like hardway does.
resources:
  - ../../sources/base
  - ../base/nvidia-gpu-operator
  - nvidia-gpu-operator-values.yaml
