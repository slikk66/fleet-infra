# The real NVIDIA GPU Operator. Installs the operator + NFD + GFD + driver +
# container-toolkit + device-plugin + dcgm, wired by a ClusterPolicy CR the
# chart creates. Sibling of base/fake-gpu-operator (clusters pick whichever
# matches their hardware).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 15m
  # helm op timeout — gpu-operator pulls several large images on first install.
  timeout: 10m
  chart:
    spec:
      chart: gpu-operator
      # Latest stable as of 2026-06 (NGC public repo). Pin explicitly so a repo
      # re-index can't silently bump us to a new major.
      version: "v26.3.2"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
      # how often source-controller re-checks the repo index for this chart.
      interval: 1h
  install:
    # gpu-operator ships CRDs (clusterpolicies, nvidiadrivers). Create them on
    # first install; replace (not delete+recreate) on upgrade to avoid dropping
    # CR instances.
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  # Cluster-specific values (k3s containerd paths) come from a ConfigMap the
  # per-cluster overlay supplies under this fixed name.
  valuesFrom:
    - kind: ConfigMap
      name: nvidia-gpu-operator-values
