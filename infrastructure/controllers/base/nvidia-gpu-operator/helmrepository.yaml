# NGC public Helm repo for the real NVIDIA GPU Operator.
# Traditional HTTP Helm repo (no auth) — the nvcr.io OCI chart registry now
# requires an NGC token, so we pull the chart from here instead. The component
# images the chart deploys still pull anonymously from nvcr.io/nvidia.
# Co-located in the gpu-operator namespace beside the HelmRelease that uses it
# (--no-cross-namespace-refs); only clusters that reference this base get it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: gpu-operator
spec:
  interval: 1h
  url: https://helm.ngc.nvidia.com/nvidia
