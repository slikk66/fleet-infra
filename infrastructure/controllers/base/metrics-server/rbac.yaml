# Installer identity for the metrics-server HelmRelease. Under the lockdown's
# --default-service-account=default, helm-controller needs an explicit SA;
# metrics-server is a PLATFORM component (registers the cluster-scoped
# v1beta1.metrics.k8s.io APIService + ClusterRoles), so it gets cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-installer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server-installer   # cluster-scoped → name must be unique cluster-wide
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: helm-installer
    namespace: kube-system
