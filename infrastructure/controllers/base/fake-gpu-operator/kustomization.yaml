apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared base for the fake-gpu-operator HelmRelease and its namespace.
# Per-cluster overlays supply a fake-gpu-operator-values ConfigMap that the HR
# references via valuesFrom. (The real NVIDIA GPU Operator lives in a sibling
# base directory nvidia-gpu-operator/ for clusters with real hardware.)
resources:
  - namespace.yaml
  - ocirepository.yaml   # chart source, co-located in gpu-operator ns (lockdown)
  - helmrelease.yaml
