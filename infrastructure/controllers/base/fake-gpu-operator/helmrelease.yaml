apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fake-gpu-operator
  namespace: gpu-operator
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: fake-gpu-operator
    # no namespace → defaults to this HelmRelease's namespace (gpu-operator),
    # the only ref allowed under --no-cross-namespace-refs.
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: fake-gpu-operator-values
