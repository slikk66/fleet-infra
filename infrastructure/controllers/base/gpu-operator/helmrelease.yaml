apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fake-gpu-operator
  namespace: gpu-operator
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: fake-gpu-operator
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: gpu-operator-values
