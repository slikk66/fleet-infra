apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Per-cluster app composition for hardway.
# Scales gpu-demo to consume all 4 simulated H100s in the cluster
# (2 workers × 2 GPUs each) — demonstrates bin-packing across the fleet.
resources:
  - ../base/gpu-demo
replicas:
  - name: gpu-demo
    count: 4
