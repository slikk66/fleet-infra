# One-shot GPU smoke test, GitOps-managed (replaces the old imperative `kubectl run`).
# Requests a real GPU (nvidia.com/gpu: 1) and runs nvidia-smi. Because the parent
# apps Kustomization sets wait: true, Flux health-checks this Job — the apps layer
# only reports READY once nvidia-smi exits 0 on the A10G. The reconciliation itself
# becomes the proof the GPU is schedulable, and it re-proves on every cluster rebuild.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke-test
  namespace: gpu-apps
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: gpu-smoke-test
    spec:
      # Select k3s's host-detected nvidia runtime. Without this the toolkit's
      # prestart hook never runs, so the container can't see the GPU devices.
      runtimeClassName: nvidia
      restartPolicy: Never
      containers:
        - name: nvidia-smi
          image: nvcr.io/nvidia/cuda:12.4.0-base-ubuntu22.04
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: 1
