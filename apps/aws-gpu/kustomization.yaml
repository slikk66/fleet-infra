apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Per-cluster app composition for aws-gpu.
# Managed workloads:
#  - gpu-smoke-test: one-shot nvidia-smi Job (GPU-schedulable proof)
#  - vllm: Phi-3-mini-4k served via vLLM (OpenAI API), real inference workload
resources:
  - namespace.yaml
  - gpu-smoke-test.yaml
  - vllm
