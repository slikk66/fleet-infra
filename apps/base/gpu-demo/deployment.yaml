apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-demo
  namespace: gpu-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-demo
  template:
    metadata:
      labels:
        app: gpu-demo
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-H100-80GB-HBM3
      containers:
        - name: workload
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Scheduled on node: $NODE_NAME"
              echo "GPU env vars injected by device-plugin:"
              env | grep -iE '(nvidia|gpu)' || echo "  (none)"
              sleep infinity
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              nvidia.com/gpu: 1
