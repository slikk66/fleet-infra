apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/hardway
  prune: true
  wait: true
  # Platform layer → cluster-admin kustomize-controller SA (survives the
  # --default-service-account=default lockdown). Apply still runs with full
  # rights, so the SOPS-decrypted Secret lands in gpu-apps as before.
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Tell kustomize-controller to SOPS-decrypt resources before applying, using the
  # age private key in Secret flux-system/sops-age (key file *.agekey). Without this,
  # the encrypted Secret would be applied verbatim (ENC[...] values) and be useless.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
