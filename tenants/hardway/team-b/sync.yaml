# The tenant's source + reconciler. Both objects live in the team-b namespace
# (not flux-system), so every reference stays in-namespace per --no-cross-namespace-refs.
# The PLATFORM tenants Kustomization creates these; the team-b Kustomization then
# reconciles the tenant's OWN repo independently, but confined by impersonation.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: team-b
  namespace: team-b
spec:
  interval: 1m
  url: ssh://git@github.com/slikk66/tenant-team-b
  ref:
    branch: main
  secretRef:
    name: deploy-key        # read-only deploy key, same ns (SOPS-provisioned)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: team-b
  namespace: team-b
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: team-b
  path: ./deploy
  prune: true
  wait: true
  # ── the two lines that make this a TENANT, not a platform Kustomization ──
  serviceAccountName: team-b   # apply AS the team-b SA (admin in team-b only)
  targetNamespace: team-b      # force every namespaced resource into team-b
