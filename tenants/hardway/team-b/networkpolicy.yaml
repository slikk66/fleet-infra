# Data-plane guardrail (platform-owned): isolate team-b from other tenants.
# Standard networking.k8s.io NetworkPolicy — enforced by Cilium (hardway's CNI).
# A single policy that is BOTH a default-deny (it selects every pod and supplies
# an explicit ingress allow-list, so anything unmatched is dropped) AND a
# same-namespace allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-tenant
  namespace: team-b
spec:
  podSelector: {}            # applies to EVERY pod in team-b
  policyTypes:
    - Ingress               # constrain INBOUND only; egress + DNS stay open
  ingress:
    - from:
        - podSelector: {}    # allow only from pods in THIS namespace (team-b)
  # Effect: team-b pods reach each other; team-a (or any other ns / external) → DROPPED.
  # Production would additionally allow ingress controllers / monitoring namespaces.
