# The identity Flux impersonates when reconciling team-a's workloads.
# A Kustomization with spec.serviceAccountName: team-a (wired in phase 1c)
# applies manifests AS this SA, so the apiserver enforces exactly the RBAC
# below — not the kustomize-controller's cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-a
  namespace: team-a
---
# RoleBinding (namespace-scoped), NOT ClusterRoleBinding — this is the whole
# isolation trick. It references the built-in `admin` ClusterRole but, because
# it's a RoleBinding in namespace team-a, those admin powers apply ONLY here.
# The tenant SA can do almost anything inside team-a and NOTHING outside it:
#   - create/edit another namespace's objects   -> DENIED
#   - touch cluster-scoped objects (Namespace,   -> DENIED
#     ClusterRole, PV, CRD, etc.)
# That denial is the boundary demo (phase 1d).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a-admin
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole       # reuse the built-in `admin` aggregated role...
  name: admin
subjects:
  - kind: ServiceAccount
    name: team-a
    namespace: team-a     # ...bound only to team-a's SA, only in team-a.
