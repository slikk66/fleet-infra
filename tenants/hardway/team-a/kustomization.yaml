apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# team-a guardrail bundle (platform-owned). Workloads live in the tenant's
# OWN repo (slikk66/tenant-team-a), pulled by a per-tenant GitRepository +
# Kustomization added in phase 1c — they are deliberately NOT listed here.
resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml       # data-plane isolation (default-deny + same-ns allow)
  - quota.yaml               # resource isolation (ResourceQuota + LimitRange)
  - deploy-key.secret.yaml   # SOPS-encrypted read-only deploy key (decrypted by Flux)
  - sync.yaml                # GitRepository + impersonated Kustomization → tenant repo
