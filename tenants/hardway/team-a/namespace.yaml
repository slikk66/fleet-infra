# Tenant namespace — the blast-radius boundary for team-a.
# The platform team (this repo) owns the namespace; the tenant only ever
# operates *inside* it via the impersonated ServiceAccount (see rbac.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    toolkit.fluxcd.io/tenant: team-a
    # Platform OPTS team-a into attaching routes to platform-gateway. The Gateway's
    # allowedRoutes selector matches this label; team-b's ns lacks it → can't attach.
    gateway-access: "true"
